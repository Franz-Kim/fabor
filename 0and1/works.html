<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작품 · 0과1 사이에서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root {
      --bg:      oklch(99% 0 0);
      --surface: oklch(100% 0 0);
      --fg:      oklch(15% 0 0);
      --muted:   oklch(50% 0 0);
      --border:  oklch(88% 0 0);
      --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --pad: clamp(20px, 5vw, 32px);
      --phone: 420px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 200;
      line-height: 1.7;
      letter-spacing: -0.01em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .phone-frame {
      max-width: var(--phone);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--pad);
      text-align: center;
    }
    @media (min-width: 480px) {
      .phone-frame {
        box-shadow: 0 0 0 1px var(--border);
        margin: 40px auto;
        min-height: calc(100vh - 80px);
        border-radius: 32px;
      }
    }
    .coming-soon {
      animation: fadeUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
    }
    .coming-soon .label {
      font-size: 11px;
      letter-spacing: 0.12em;
      font-weight: 300;
      color: var(--muted);
      margin-bottom: 16px;
    }
    .coming-soon .date {
      font-size: 28px;
      font-weight: 200;
      letter-spacing: -0.02em;
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .coming-soon .time {
      font-size: 14px;
      font-weight: 200;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .coming-soon .divider {
      width: 24px;
      height: 1px;
      background: var(--fg);
      margin: 28px auto;
      opacity: 0.3;
    }
    .coming-soon .sub {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-foot {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    @media (max-width: 479px) {
      .page-foot { bottom: 72px; }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="coming-soon">
      <div class="label">WORKS</div>
      <div class="date">7월 30일</div>
      <div class="time">오후 5시 공개됩니다</div>
      <div class="divider"></div>
      <div class="sub">전시 작품 이미지를 준비 중입니다</div>
    </div>
    <footer class="page-foot">
      0과1 사이에서. 김승기 한우현 (2026)
    </footer>
  </div>

  <nav class="nav-pill">
    <a href="index.html?skipSplash">INTRO</a>
    <a href="works.html" class="active">WORKS</a>
    <a href="process.html">PROCESS</a>
    <a href="artists.html">ARTISTS</a>
  </nav>

  <style>
    .nav-pill {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 0;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 40px;
      padding: 4px;
      border: 0.5px solid #111;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .nav-pill a {
      color: rgba(0,0,0,0.55);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 40px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .nav-pill a:hover,
    .nav-pill a.active {
      color: #000;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    @media (max-width: 479px) {
      .nav-pill { bottom: 20px; }
      .nav-pill a { padding: 7px 12px; font-size: 10px; }
    }
  </style>
</body>
</html>
