<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작품 · 0과1 사이에서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root {
      --bg:      oklch(99% 0 0);
      --surface: oklch(100% 0 0);
      --fg:      oklch(15% 0 0);
      --muted:   oklch(50% 0 0);
      --border:  oklch(88% 0 0);

      --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;

      --pad: clamp(20px, 5vw, 32px);
      --phone: 420px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 200;
      line-height: 1.7;
      letter-spacing: -0.01em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .phone-frame {
      max-width: var(--phone);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--surface);
      overflow: hidden;
    }
    @media (min-width: 480px) {
      .phone-frame {
        box-shadow: 0 0 0 1px var(--border);
        margin: 40px auto;
        min-height: calc(100vh - 80px);
        border-radius: 32px;
      }
    }

    img { max-width: 100%; height: auto; display: block; }

    .gallery-wrap {
      position: relative;
      padding: 60px var(--pad) 80px;
    }

    .gallery-item {
      width: 100%;
      margin-bottom: 48px;
      position: relative;
      will-change: transform;
    }

    .gallery-item .ph-img {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: opacity 0.4s;
    }
    .gallery-item .ph-img:hover { opacity: 0.7; }

    .gallery-item.wide { max-width: 100%; }
    .gallery-item.med { max-width: 82%; margin-left: auto; margin-right: auto; }
    .gallery-item.narr { max-width: 64%; margin-left: auto; margin-right: auto; }

    .gallery-item.portrait .ph-img { aspect-ratio: 3 / 4; }
    .gallery-item.landscape .ph-img { aspect-ratio: 4 / 3; }
    .gallery-item.square .ph-img { aspect-ratio: 1 / 1; }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(0,0,0,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      cursor: pointer;
    }
    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .page-foot {
      padding: 40px var(--pad) 40px;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="gallery-wrap" id="gallery">
      <div class="gallery-item portrait narr" data-speed="-0.08">
        <div class="ph-img">[ 01 ]</div>
      </div>
      <div class="gallery-item landscape med" data-speed="0.12">
        <div class="ph-img">[ 02 ]</div>
      </div>
      <div class="gallery-item square wide" data-speed="-0.16">
        <div class="ph-img">[ 03 ]</div>
      </div>
      <div class="gallery-item portrait med" data-speed="0.06">
        <div class="ph-img">[ 04 ]</div>
      </div>
      <div class="gallery-item landscape narr" data-speed="-0.20">
        <div class="ph-img">[ 05 ]</div>
      </div>
      <div class="gallery-item square med" data-speed="0.14">
        <div class="ph-img">[ 06 ]</div>
      </div>
      <div class="gallery-item portrait narr" data-speed="-0.10">
        <div class="ph-img">[ 07 ]</div>
      </div>
      <div class="gallery-item landscape wide" data-speed="0.18">
        <div class="ph-img">[ 08 ]</div>
      </div>
    </div>

    <footer class="page-foot">
      0과1 사이에서. 김승기 한우현 (2026)
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <img src="" alt="" id="lightbox-img" />
  </div>

  <nav class="nav-pill">
    <a href="index.html">INTRO</a>
    <a href="works.html" class="active">WORKS</a>
    <a href="process.html">PROCESS</a>
    <a href="artists.html">ARTISTS</a>
  </nav>

  <style>
    .nav-pill {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 0;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 40px;
      padding: 4px;
      border: 0.5px solid #111;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .nav-pill a {
      color: rgba(0,0,0,0.55);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 40px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .nav-pill a:hover,
    .nav-pill a.active {
      color: #000;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    @media (max-width: 479px) {
      .nav-pill { bottom: 20px; }
      .nav-pill a { padding: 7px 12px; font-size: 10px; }
    }
  </style>

  <script>
    const items = document.querySelectorAll('.gallery-item');
    const gallery = document.getElementById('gallery');

    function updateParallax() {
      const rect = gallery.getBoundingClientRect();
      const center = window.innerHeight / 2;
      items.forEach(item => {
        const speed = parseFloat(item.dataset.speed) || 0;
        const itemRect = item.getBoundingClientRect();
        const itemCenter = itemRect.top + itemRect.height / 2;
        const offset = (itemCenter - center) * speed;
        item.style.transform = `translateY(${offset}px)`;
      });
    }

    window.addEventListener('scroll', updateParallax, { passive: true });
    updateParallax();

    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    document.querySelectorAll('.gallery-item .ph-img').forEach(el => {
      el.addEventListener('click', () => {
        lbImg.src = '';
        lb.classList.add('open');
      });
    });
    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') lb.classList.remove('open');
    });
  </script>
</body>
</html>
