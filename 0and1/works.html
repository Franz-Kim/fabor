<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>작품 · 0과1 사이에서</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    :root {
      --bg:      oklch(99% 0 0);
      --surface: oklch(100% 0 0);
      --fg:      oklch(15% 0 0);
      --muted:   oklch(50% 0 0);
      --border:  oklch(88% 0 0);
      --font: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --pad: clamp(20px, 5vw, 32px);
      --phone: 420px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 200;
      line-height: 1.7;
      letter-spacing: -0.01em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .phone-frame {
      max-width: var(--phone);
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--pad);
      padding-top: 48px;
      padding-bottom: 120px;
    }
    @media (min-width: 480px) {
      .phone-frame {
        box-shadow: 0 0 0 1px var(--border);
        margin: 40px auto;
        min-height: calc(100vh - 80px);
        border-radius: 32px;
      }
    }
    .gallery {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .gallery-item {
      width: 100%;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 2.8s cubic-bezier(0.22, 1, 0.36, 1), transform 2.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .gallery-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }
    .gallery-item img,
    .gallery-item video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0;
      filter: grayscale(0.5);
    }
    .page-foot {
      width: 100%;
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      padding-top: 48px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="gallery" id="gallery"></div>
    <footer class="page-foot">
      0과1 사이에서. 김승기 한우현 (2026)
    </footer>
  </div>

  <nav class="nav-pill">
    <a href="index.html?skipSplash">INTRO</a>
    <a href="works.html" class="active">WORKS</a>
    <a href="process.html">PROCESS</a>
    <a href="artists.html">ARTISTS</a>
  </nav>

  <style>
    .nav-pill {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 0;
      background: rgba(255, 255, 255, 0.64);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border-radius: 40px;
      padding: 4px;
      border: 0.5px solid #111;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .nav-pill a {
      color: rgba(0,0,0,0.55);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      border-radius: 40px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }
    .nav-pill a:hover,
    .nav-pill a.active {
      color: #000;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    @media (max-width: 479px) {
      .nav-pill { bottom: 20px; }
      .nav-pill a { padding: 7px 12px; font-size: 10px; }
    }
  </style>

  <script>
    const mediaItems = [
      { type: 'img', src: 'works-images/ms652usp-01_preview.avif' },
      { type: 'img', src: 'works-images/ms652uss-02_main1.avif' },
      { type: 'video', src: 'works-images/ms652usu-03_main2.mp4' },
      { type: 'img', src: 'works-images/ms652ute-04_woohyun1.avif' },
      { type: 'img', src: 'works-images/ms652ute-05_woohyun2.avif' },
      { type: 'video', src: 'works-images/ms652ute-06_woohyun2_2.mp4' },
      { type: 'img', src: 'works-images/ms652utl-07_seungki_fullshot.avif' },
      { type: 'video', src: 'works-images/ms652uto-08_1_seungki_colorpendul.mp4' },
      { type: 'img', src: 'works-images/ms652uu1-08_2_seungki_detailshot.avif' },
      { type: 'video', src: 'works-images/ms652uu2-09_seungki_pendulum01.mp4' },
      { type: 'video', src: 'works-images/ms652uua-10_seungki_clock1.mp4' },
      { type: 'img', src: 'works-images/ms652uv7-12_woohyun3.avif' },
      { type: 'img', src: 'works-images/ms652uvn-13_woohyun3_2.avif' },
      { type: 'video', src: 'works-images/ms652uvo-14_woohyun3_3.mp4' },
      { type: 'img', src: 'works-images/ms652uvr-15_woohyun4.avif' },
      { type: 'img', src: 'works-images/ms652uvs-16_woohyun4_2.avif' },
      { type: 'img', src: 'works-images/ms652uvt-17_woohyun5.avif' },
      { type: 'img', src: 'works-images/ms652uvt-18_seungki_partition.avif' },
    ];

    const gallery = document.getElementById('gallery');
    mediaItems.forEach((item) => {
      const div = document.createElement('div');
      div.className = 'gallery-item';
      const el = document.createElement(item.type);
      el.src = item.src;
      if (item.type === 'video') {
        el.autoplay = true;
        el.muted = true;
        el.loop = true;
        el.playsinline = true;
      }
      div.appendChild(el);
      gallery.appendChild(div);
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('revealed');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.gallery-item').forEach(el => observer.observe(el));
  </script>
</body>
</html>
